name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_visual_snapshots:
        description: "Regenerate demo-mode visual baselines (review the uploaded artifact)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    name: Static Analysis & Build
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Unit tests (Jest)
        run: npm run test:unit -- --runInBand

      - name: Preflight (8-gate validation suite)
        run: bash scripts/preflight.sh

      - name: Secret and server-boundary scan
        run: npm run security:scan

  e2e-smoke:
    name: Playwright Hermetic Smoke
    timeout-minutes: 35
    runs-on: ubuntu-latest
    needs: typecheck-and-build
    env:
      APP_ENV: development
      E2E_BASE_URL: http://localhost:3000
      E2E_WEBSERVER_COMMAND: "npm run start"
      E2E_BRIDGE_COMMAND: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build production app for deterministic smoke tests
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare a disposable trial license for browser tests
        env:
          E2E_PREPARE_LICENSE: "1"
        run: node scripts/prepare-e2e-settings.mjs

      - name: Check whether visual baselines need bootstrapping
        id: visual-baselines
        shell: bash
        run: |
          if [[ -f "e2e/specs/visual-regression.spec.ts-snapshots/dashboard-chromium-linux.png" &&
                -f "e2e/specs/visual-regression.spec.ts-snapshots/analytics-chromium-linux.png" ]]; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      # One-time bootstrap only when PNG fixtures are absent. The resulting
      # images are uploaded for review and must be committed before relying on
      # subsequent runs as pixel-regression gates.
      - name: Bootstrap missing visual baselines
        if: ${{ steps.visual-baselines.outputs.missing == 'true' }}
        run: npx playwright test e2e/specs/visual-regression.spec.ts --update-snapshots

      - name: Regenerate visual baselines on explicit manual run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_snapshots }}
        run: npx playwright test e2e/specs/visual-regression.spec.ts --update-snapshots

      # These specs use mocked AI streams or the no-Supabase demo fallback.
      # RBAC override tests remain in the dev-server integration job because
      # the security test hook is intentionally disabled for production builds.
      - name: Run hermetic browser smoke tests
        run: >-
          npx playwright test
          e2e/specs/workflow-builder.spec.ts
          e2e/specs/copilot-chat.spec.ts
          e2e/specs/visual-regression.spec.ts
          e2e/visuals.spec.ts
          tests/e2e/copilot-agent.spec.ts
          tests/e2e/realtime-sync.spec.ts

      - name: Upload smoke-test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 14

      - name: Upload smoke-test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-results
          path: test-results/
          retention-days: 7

      - name: Upload visual baselines for review
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-baselines
          path: e2e/specs/visual-regression.spec.ts-snapshots/
          if-no-files-found: ignore
          retention-days: 14

  e2e-tests:
    name: Playwright E2E
    timeout-minutes: 75
    runs-on: ubuntu-latest
    needs: typecheck-and-build
    env:
      APP_ENV: development
      E2E_SERIAL: "1"
      E2E_BASE_URL: http://localhost:3000
      E2E_BRIDGE_URL: http://localhost:8000
      PYTHON_BRIDGE_ALLOWED_SCRAPE_HOSTS: example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: Start disposable local Supabase stack
        run: |
          supabase start
          supabase db reset

      - name: Export local Supabase and E2E credentials
        shell: bash
        run: |
          set -euo pipefail
          status_file="$(mktemp)"
          supabase status -o env > "$status_file"
          set -a
          # Supabase CLI emits shell-compatible KEY="value" entries.
          source "$status_file"
          set +a

          api_url="${API_URL:-${SUPABASE_URL:-http://127.0.0.1:54321}}"
          publishable_key="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          secret_key="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          if [[ -z "$api_url" || -z "$publishable_key" || -z "$secret_key" ]]; then
            echo "::error::Supabase CLI did not expose the local API URL and public/admin keys."
            exit 1
          fi

          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$api_url"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$publishable_key"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$publishable_key"
            echo "SUPABASE_SECRET_KEY=$secret_key"
            echo "SUPABASE_SERVICE_ROLE_KEY=$secret_key"
            # The local API hostname is 127.0.0.1, so Supabase's browser
            # storage key prefix is "sb-127-auth-token".
            echo "SUPABASE_PROJECT_REF=127"
            echo "E2E_TEST_USER_EMAIL=ci-e2e@fluxentiq.test"
            echo "E2E_TEST_USER_PASSWORD=$(openssl rand -hex 32)"
            echo "BRIDGE_SECRET_KEY=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare a disposable trial license for browser tests
        env:
          E2E_PREPARE_LICENSE: "1"
        run: node scripts/prepare-e2e-settings.mjs

      - name: Run Playwright E2E
        run: npx playwright test

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test-results (traces/screenshots on failure)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
